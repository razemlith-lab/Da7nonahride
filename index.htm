<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق تتبع رحلات العمل (Carpooling)</title>
    <!-- استدعاء مكتبة توليد الـ PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #22c55e;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
            font-size: 26px;
        }
        h2 {
            color: #334155;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
        }
        form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        form input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        form input:focus {
            border-color: var(--primary);
        }
        button {
            padding: 12px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-danger {
            background-color: var(--danger);
        }
        .btn-danger:hover {
            background-color: var(--danger-hover);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            overflow: hidden;
            border-radius: 8px;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 14px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #f1f5f9;
            color: #475569;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background-color: #fcfcfc;
        }
        .actions-cell button {
            padding: 6px 10px;
            margin: 2px;
            font-size: 13px;
        }
        .logs-container {
            max-height: 180px;
            overflow-y: auto;
            font-size: 13px;
            color: var(--text-light);
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: right;
        }
        .reset-section {
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="container" id="invoice-content">
    <h1>تطبيق تتبع رحلات العمل (Carpooling)</h1>

    <!-- قسم إضافة شخص جديد -->
    <div class="section">
        <h2>إضافة مشارك جديد</h2>
        <form id="add-person-form">
            <input type="text" id="person-name" placeholder="اسم الزميل" required>
            <input type="number" id="trip-cost" placeholder="تكلفة الرحلة الواحدة (د.أ)" required step="0.5">
            <button type="submit">إضافة الشخص</button>
        </form>
    </div>

    <!-- جدول عرض البيانات والحسابات الشهرية -->
    <div class="section">
        <h2>سجل الرحلات والحسابات الشهرية</h2>
        <table>
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>تكلفة الرحلة</th>
                    <th>عدد رحلات الذهاب</th>
                    <th>عدد رحلات العودة</th>
                    <th>الإجمالي المستحق</th>
                    <th>إجراءات تسجيل الرحلات</th>
                </tr>
            </thead>
            <tbody id="users-table-body">
                <!-- سيتم تعبئة البيانات ديناميكياً -->
            </tbody>
        </table>
    </div>

    <!-- سجل الأنشطة والتواريخ -->
    <div class="section">
        <h2>سجل التواريخ والرحلات المسجلة</h2>
        <div id="activity-logs" class="logs-container">
            لم يتم تسجيل أي رحلات بعد.
        </div>
    </div>

    <!-- زر إصدار الفاتورة وتصفير الحسابات -->
    <div class="reset-section">
        <button id="reset-month-btn" class="btn-danger">إصدار فاتورة PDF وتصفير الشهر</button>
    </div>
</div>

<script type="module">
    let users = JSON.parse(localStorage.getItem('carpool_users')) || [];
    let logs = JSON.parse(localStorage.getItem('carpool_logs')) || [];

    const form = document.getElementById('add-person-form');
    const tableBody = document.getElementById('users-table-body');
    const resetBtn = document.getElementById('reset-month-btn');
    const logsContainer = document.getElementById('activity-logs');

    function saveAndRender() {
        localStorage.setItem('carpool_users', JSON.stringify(users));
        localStorage.setItem('carpool_logs', JSON.stringify(logs));
        renderTable();
        renderLogs();
    }

    function renderTable() {
        tableBody.innerHTML = '';
        if (users.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="6">لا يوجد مشاركون حالياً. قم بإضافة شخص للبدء.</td></tr>`;
            return;
        }

        users.forEach((user, index) => {
            const totalCost = (user.goes + user.returns) * user.cost;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${user.name}</strong></td>
                <td>${user.cost} د.أ</td>
                <td>
                    ${user.goes} 
                    <button onclick="updateCount(${index}, 'goes', 1)">+</button>
                    <button onclick="updateCount(${index}, 'goes', -1)">-</button>
                </td>
                <td>
                    ${user.returns} 
                    <button onclick="updateCount(${index}, 'returns', 1)">+</button>
                    <button onclick="updateCount(${index}, 'returns', -1)">-</button>
                </td>
                <td><strong style="color: var(--primary);">${totalCost} د.أ</strong></td>
                <td class="actions-cell">
                    <button onclick="deleteUser(${index})" class="btn-danger">حذف</button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    function renderLogs() {
        if (logs.length === 0) {
            logsContainer.innerHTML = 'لم يتم تسجيل أي رحلات بعد.';
            return;
        }
        logsContainer.innerHTML = logs.map(log => `<div>• ${log}</div>`).join('');
    }

    // إضافة شخص جديد
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('person-name').value;
        const cost = parseFloat(document.getElementById('trip-cost').value);

        users.push({ name, cost, goes: 0, returns: 0 });
        form.reset();
        saveAndRender();
    });

    // تحديث عدد الرحلات مع حفظ التاريخ والوقت تلقائياً
    window.updateCount = function(index, type, delta) {
        if (delta > 0) {
            users[index][type] += 1;
            const now = new Date();
            const dateStr = now.toLocaleDateString('ar-JO');
            const timeStr = now.toLocaleTimeString('ar-JO', { hour: '2-digit', minute: '2-digit' });
            const typeText = type === 'goes' ? 'رحلة ذهاب' : 'رحلة عودة';
            logs.unshift(`تم تسجيل ${typeText} لـ ${<span>users[index].name</span>} بتاريخ ${dateStr} الساعة ${timeStr}`);
        } else {
            if (users[index][type] > 0) {
                users[index][type] -= 1;
            }
        }
        saveAndRender();
    }

    // حذف شخص
    window.deleteUser = function(index) {
        if(confirm('هل أنت متأكد من حذف هذا الزميل؟')) {
            users.splice(index, 1);
            saveAndRender();
        }
    }

    // إصدار فاتورة PDF وتصفير الحسابات
    resetBtn.addEventListener('click', () => {
        if(confirm('هل تريد إصدار الفاتورة بصيغة PDF وتصفير عداد الرحلات لبدء شهر جديد؟')) {
            const element = document.getElementById('invoice-content');
            const opt = {
                margin:       10,
                filename:     `carpool-invoice-${new Date().toLocaleDateString('en-GB')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // توليد وتحميل ملف الـ PDF
            html2pdf().from(element).set(opt).save().then(() => {
                // تصفير البيانات بعد تحميل الفاتورة
                users.forEach(user => {
                    user.goes = 0;
                    user.returns = 0;
                });
                logs = [];
                saveAndRender();
                alert('تم إصدار الفاتورة وتصفير الرحلات بنجاح لبدء شهر جديد!');
            });
        }
    });

    renderTable();
    renderLogs();
</script>

</body>
</html>
